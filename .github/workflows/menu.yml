# 🚀 Java CI Workflow

name: CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Faz checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configura o JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3️⃣ Cache do Maven para builds mais rápidos
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/CalculadoraContas/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # 4️⃣ Compila o projeto e executa os testes
      - name: Build with Maven
        run: mvn clean verify -B

      # 5️⃣ Faz upload dos relatórios de teste
      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
